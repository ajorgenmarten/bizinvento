name: Build Multi-Platform

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            build_script: build:linux
          - os: windows-latest
            build_script: build:win
          - os: macos-latest
            build_script: build:linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true # Habilitar el almacenamiento en caché del store de pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm' # Permitir que setup-node gestione la caché de pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Ejecutar electron-builder (usar pnpm para ejecutar los scripts definidos en package.json)
      - name: Build Electron App
        run: pnpm ${{ matrix.build_script }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/*
