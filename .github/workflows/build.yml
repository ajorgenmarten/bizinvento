name: Build Electron App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            script: build:win
          - platform: Linux
            os: ubuntu-latest
            script: build:linux
          - platform: macOS
            os: macos-latest
            script: build:mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run ${{ matrix.script }} -- --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bizinvento-${{ matrix.platform }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14
